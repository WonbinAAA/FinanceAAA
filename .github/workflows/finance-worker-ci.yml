name: Finance Worker checks
on:
  push:
    branches: [cloudflare-d1]
    paths: ['finance-worker/**', '.github/workflows/finance-worker-ci.yml']
  pull_request:
    paths: ['finance-worker/**', '.github/workflows/finance-worker-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: finance-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
