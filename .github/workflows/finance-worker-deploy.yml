name: Deploy Finance preview to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-cloudflare-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/cloudflare-d1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: finance-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Apply preview schema and deploy
        run: npm run deploy:actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINANCE_D1_DATABASE_ID: ${{ vars.FINANCE_D1_DATABASE_ID }}
          FINANCE_APP_ORIGIN: ${{ vars.FINANCE_APP_ORIGIN }}
