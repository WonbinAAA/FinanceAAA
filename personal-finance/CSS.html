<style>
:root {
  --bg:#f7f8ff;
  --card:#fff;
  --text:#242541;
  --muted:#777b94;
  --line:#e9e8f6;
  --primary:#6557e9;
  --shadow:0 12px 32px rgba(77,68,148,.09)
}
* {
  box-sizing:border-box
}
html,body {
  margin:0;
  min-height:100%
}
body {
  background:radial-gradient(circle at 4% 0%,#eee7ff 0,transparent 35%),radial-gradient(circle at 98% 18%,#ffeef3 0,transparent 30%),var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif
}
.svg-sprite {
  position:absolute;
  width:0;
  height:0;
  overflow:hidden
}
.icon {
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none
}
.app {
  max-width:540px;
  margin:auto;
  padding:22px 16px 118px
}
.topbar {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:14px
}
.topbar-title {min-width:0;flex:1 1 200px}
.topbar-actions {display:flex;align-items:center;gap:8px;margin-left:auto}
.help-trigger {
  min-height:38px;
  padding:0 12px;
  border:1px solid #ddd6ff;
  border-radius:999px;
  background:#fff;
  color:#5c4ed4;
  box-shadow:var(--shadow);
  font:inherit;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer
}
.eyebrow {
  font-size:10px;
  color:#7766e7;
  font-weight:800;
  letter-spacing:.12em;
  display:flex;
  align-items:center;
  gap:6px
}
.topbar h1,.dialog-head h2 {
  margin:3px 0 0
}
.topbar h1 {
  margin-top:0;
  font-size:clamp(19px,5.7vw,24px);
  letter-spacing:-.02em
}
.month-pill,.card {
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow)
}
.month-pill {
  padding:9px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  color:#5c4ed4;
  white-space:nowrap;
  flex:none
}
.card {
  border-radius:24px
}
.hero {
  position:relative;
  overflow:hidden;
  padding:22px;
  margin-bottom:14px;
  border:0;
  color:#fff;
  background:radial-gradient(circle at 95% 0%,#b08affaa 0,transparent 36%),linear-gradient(130deg,#6557e9,#45409b 70%,#343773);
  box-shadow:0 16px 36px #5047bb42
}
.hero::after {
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  right:-80px;
  bottom:-95px;
  border-radius:50%;
  background:#ff6caa55;
  pointer-events:none
}
.hero-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:750;
  color:#fffdfde6
}
.hero-mark {
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:13px;
  background:#ffffff2a
}
.muted,.hint,small {
  color:var(--muted)
}
.hero-money {
  font-size:clamp(31px,9vw,43px);
  font-weight:850;
  letter-spacing:-.045em;
  margin:8px 0 2px;
  position:relative;
  z-index:1
}
.hero-caption {
  color:#e9e8ff;
  font-size:11px;
  line-height:1.5
}
.balance-formula {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-top:19px;
  padding-top:14px;
  border-top:1px solid #ffffff35;
  position:relative;
  z-index:1
}
.balance-formula span {
  display:block;
  font-size:10px;
  color:#e5e4ff;
  min-width:0
}
.balance-formula b {
  display:block;
  color:#fff;
  font-size:12px;
  margin-top:4px;
  white-space:nowrap
}
.hint {
  font-size:11px;
  line-height:1.5
}
.summary-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-bottom:14px
}
.metric {
  padding:16px;
  min-height:148px;
  box-shadow:none
}
.metric-income {background:#eafbf4;border-color:#d8f6e8}
.metric-expense {background:#fff0f0;border-color:#ffe0e1}
.metric-company {background:#f1edff;border-color:#e5dcff}
.metric-debt {background:#fff6e5;border-color:#ffedc9}
.metric .metric-icon {
  display:grid;
  place-items:center;
  width:33px;
  height:33px;
  border-radius:11px;
  margin-bottom:10px;
  background:#ffffffb8
}
.metric-income .metric-icon,.metric-income b {color:#167f61}
.metric-expense .metric-icon,.metric-expense b {color:#dc5862}
.metric-company .metric-icon,.metric-company b {color:#7554d4}
.metric-debt .metric-icon,.metric-debt b {color:#b87917}
.metric .metric-icon .icon {width:19px;height:19px}
.metric span {
  font-size:12px;
  color:var(--muted)
}
.metric b {
  display:block;
  font-size:19px;
  margin-top:4px;
  white-space:nowrap
}
.metric small {
  display:block;
  font-size:10px;
  margin-top:5px
}
.section-card {
  padding:18px;
  margin-bottom:14px
}
.section-title {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:5px
}
.section-icon {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:12px;
  color:#6b5ad9;
  background:#efebff
}
.section-title small {
  display:block;
  font-size:11px;
  margin-top:3px
}
.account-section-title {flex-wrap:wrap}
.account-title-copy {flex:1;min-width:110px}
.account-section-actions {display:flex;align-items:center;gap:6px;margin-left:auto}
.account-view-toggle {
  display:flex;
  align-items:center;
  gap:5px;
  min-height:34px;
  padding:6px 8px;
  border:1px solid #dcd6fa;
  border-radius:10px;
  background:#f6f3ff;
  color:#6152ca;
  font:inherit;
  font-size:11px;
  font-weight:750;
  cursor:pointer
}
.account-view-toggle .icon {width:17px;height:17px}
.account-view-toggle:disabled {opacity:.5;cursor:default}
.account-total {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:12px 0 2px;
  padding:12px 14px;
  border-radius:13px;
  background:#f3f0ff;
  color:#5043b4;
  font-size:12px;
  font-weight:750
}
.account-total b {font-size:18px;white-space:nowrap}
.list-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}
.row-main {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}
.row-copy {min-width:0}
.row-icon {
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:13px;
  flex:none
}
.row-icon .icon {width:19px;height:19px}
.row-icon.income {background:#e6f9ef;color:#16946f}
.row-icon.expense {background:#ffebee;color:#e45765}
.row-icon.expense.company {background:#f1edff;color:#7554d4}
.row-icon.transfer {background:#eeecff;color:#705de0}
.row-icon.account-cash {background:#e6f9ef;color:#16946f}
.row-icon.account-logo {position:relative;overflow:hidden;background:#fff;border:1px solid #eceaf2}
.account-logo img {display:block;width:100%;height:100%;object-fit:contain}
.account-logo.truemoney img {position:absolute;top:50%;left:50%;width:76px;height:76px;max-width:none;transform:translate(-50%,-28%)}
.row-value.income {color:#15956c}
.row-value.expense {color:#d94c60}
.row-value.expense.company {color:#7554d4}
.row-value.transfer {color:#6456ce}
.list-row:last-child {
  border:0
}
.row-title {
  font-size:13px;
  font-weight:750
}
.row-sub {
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}
.row-value {
  font-size:13px;
  font-weight:850;
  white-space:nowrap
}
.empty {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:16px 0
}
.bottom-nav {
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(540px,100%);
  display:grid;
  grid-template-columns:1fr 1fr 70px 1fr 1fr;
  align-items:center;
  background:#ffffffed;
  border:1px solid #e8e5fa;
  border-bottom:0;
  border-radius:23px 23px 0 0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 32px #4c41951a;
  backdrop-filter:blur(18px);
  z-index:5
}
.bottom-nav button {
  border:0;
  background:transparent;
  color:#9495ad;
  min-height:52px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border-radius:14px;
  cursor:pointer;
  transition:color .2s,background .2s,transform .2s
}
.bottom-nav button span {
  display:block;
  font-size:10px;
  margin:0
}
.bottom-nav .add {
  width:54px;
  height:54px;
  min-height:0;
  justify-self:center;
  border-radius:18px;
  background:linear-gradient(135deg,#ff5e9c,#f0446c);
  color:#fff;
  box-shadow:0 8px 18px #f0446c55
}
.bottom-nav .add .icon {width:27px;height:27px;stroke-width:2.5}
dialog {
  width:min(510px,calc(100% - 18px));
  max-height:calc(100vh - 24px);
  border:0;
  border-radius:26px;
  padding:0;
  box-shadow:0 30px 90px #0003
}
dialog::backdrop {
  background:#1115;
  backdrop-filter:blur(2px)
}
.dialog-body {
  padding:19px;
  max-height:calc(100vh - 24px);
  overflow:auto
}
.help-intro {margin:12px 0 16px;color:var(--muted);font-size:12px;line-height:1.6}
.help-quick {
  padding:15px;
  border-radius:17px;
  background:linear-gradient(130deg,#f0edff,#fff1f6);
  border:1px solid #e7dfff;
  font-size:13px;
  line-height:1.65
}
.help-quick b {color:#5043ba}
.help-quick ol {margin:9px 0 0;padding-left:22px}
.help-quick li + li {margin-top:5px}
.help-topics {margin-top:15px;border-top:1px solid var(--line)}
.help-topics details {border-bottom:1px solid var(--line)}
.help-topics summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:52px;
  padding:10px 3px;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
  list-style:none
}
.help-topics summary::-webkit-details-marker {display:none}
.help-topics summary::after {content:'+';color:var(--primary);font-size:21px;font-weight:500}
.help-topics details[open] summary::after {content:'−'}
.help-topics details > div {padding:0 3px 11px;color:#555b70;font-size:12px;line-height:1.65}
.help-topics p {margin:0 0 9px}
.help-topics p:last-child {margin-bottom:0}
.help-topics strong {color:var(--text)}
.dialog-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}
.close {
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#f2f3f5;
  font-size:22px
}
.info {
  margin:15px 0;
  padding:12px 13px;
  background:#f8f9fb;
  border:1px solid var(--line);
  border-radius:14px;
  color:#626975;
  font-size:11px;
  line-height:1.6
}
.type-switch {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin-bottom:18px
}
.type-switch button {
  min-height:44px;
  padding:10px 7px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  font-weight:750;
  color:#555d68
}
.type-switch button.active {
  background:linear-gradient(135deg,#745cff,#5b4fd2);
  color:#fff;
  border-color:var(--primary)
}
.type-switch button[data-entry-kind="COMPANY"].active {background:#7554d4;border-color:#7554d4}
.type-switch button[data-entry-kind="INCOME"].active {background:#16946f;border-color:#16946f}
.type-switch button[data-entry-kind="TRANSFER"].active {background:#5674dc;border-color:#5674dc}
.transaction-view-switch {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0 10px;
  margin-bottom:2px;
  scrollbar-width:none
}
.transaction-view-switch::-webkit-scrollbar {display:none}
.transaction-view-switch button {
  flex:none;
  min-height:39px;
  padding:8px 12px;
  border:1px solid #e3dfef;
  border-radius:999px;
  background:#fff;
  color:#575a69;
  font:inherit;
  font-size:11px;
  font-weight:750
}
.transaction-view-switch button[aria-pressed="true"] {
  background:#6654d9;
  color:#fff;
  border-color:#6654d9
}
.transaction-view-switch button[data-view="personal"][aria-pressed="true"] {background:#dc5862;border-color:#dc5862}
.transaction-view-switch button[data-view="company"][aria-pressed="true"] {background:#7554d4;border-color:#7554d4}
.transaction-view-switch button[data-view="income"][aria-pressed="true"] {background:#16946f;border-color:#16946f}
.field {
  margin-bottom:15px
}
.field label {
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px
}
.field small {
  display:block;
  font-size:10.5px;
  line-height:1.45;
  margin-top:5px
}
.company-project {
  padding:13px;
  border:1px solid #e5dcff;
  border-radius:15px;
  background:#f8f5ff
}
.category-picker {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:7px;
  min-width:0
}
.category-picker select {min-width:0}
.category-manage-button {
  min-width:64px;
  padding:0 9px;
  border-radius:13px;
  color:var(--primary);
  font-size:12px;
  font-weight:800
}
.category-add-button {min-width:46px;font-size:23px;line-height:1}
.category-editor-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin:4px 0 18px
}
.category-editor-actions button {
  min-height:42px;
  padding:0 15px;
  border-radius:12px;
  font-weight:800
}
.category-manager-list {
  max-height:min(42vh,350px);
  overflow:auto;
  border-top:1px solid var(--line);
  margin-bottom:18px
}
.category-manager-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:61px;
  padding:9px 0;
  border-bottom:1px solid var(--line)
}
.category-manager-row > div:first-child {min-width:0}
.category-manager-row b {display:block;overflow-wrap:anywhere;font-size:13px}
.category-manager-row small {display:block;color:var(--muted);font-size:10px}
.category-manager-row .inline-actions {display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;flex:none;max-width:220px}
.category-manager-row button {min-height:38px;padding:0 9px;font-size:11px}
.category-manager-row .category-order {min-width:34px;padding:0 7px;font-size:16px}
.category-manager-row .category-top {padding:0 7px}
.category-manager-row.is-inactive {opacity:.65}
input,select,textarea {
  width:100%;
  padding:12px 13px;
  border:1px solid #dfe2e7;
  border-radius:13px;
  background:#fff;
  color:var(--text);
  font:inherit;
  outline:none
}
input:focus,select:focus,textarea:focus {
  border-color:#a99af4;
  box-shadow:0 0 0 3px #735ce91b
}
.hidden {
  display:none!important
}
.actions {
  display:grid;
  grid-template-columns:1fr 1.5fr;
  gap:9px;
  margin-top:20px
}
.actions button {
  min-height:46px;
  border-radius:13px;
  font-weight:800
}
.secondary {
  background:#fff;
  border:1px solid var(--line)
}
.primary {
  background:linear-gradient(135deg,#745cff,#5b4fd2);
  color:#fff;
  border:1px solid #6755dd
}
.toast {
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%) translateY(-12px);
  width:min(430px,calc(100% - 28px));
  padding:12px 14px;
  border-radius:14px;
  background:#2e285f;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100
}
.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
.page-heading {
  margin:4px 0 16px
}
.page-heading h2 {
  font-size:22px;
  margin:0
}
.page-heading p {
  font-size:12px;
  color:var(--muted);
  margin:5px 0 0
}
.filters {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:13px;
  margin-bottom:12px
}
.filters input,.filters select {
  min-width:0;
  font-size:12px
}
.filters .category-picker {grid-column:1/-1}
.account-picker-button {
  display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:7px 12px;
  border:1px solid #dfe2e7;border-radius:13px;background:#fff;color:var(--text);
  text-align:left;font:inherit;font-weight:750
}
.account-picker-button .row-icon {width:38px;height:38px;flex:none}
.account-choice {width:100%;border:0;background:transparent;text-align:left;font:inherit;color:var(--text);cursor:pointer}
.account-choice .row-main,.account-setting .row-main {display:flex;align-items:center;gap:10px;min-width:0}
.account-setting {gap:8px}
.account-setting button {flex:none}
.recurring-icon {background:#efecff;color:#6751d6}
.icon-choices {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.icon-choices button {display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#6f62c7}
.icon-choices button[aria-pressed="true"] {background:#efecff;border-color:#7562de}
.icon-choices .icon {width:22px;height:22px}
.filters #filterSearch {
  grid-column:1/-1
}
.transaction-row {
  width:100%;
  background:transparent;
  border-top:0;
  border-left:0;
  border-right:0;
  text-align:left;
  cursor:pointer;
  font:inherit;
  color:inherit
}
.transaction-row:focus-visible,button:focus-visible {
  outline:3px solid #98a9c9;
  outline-offset:2px
}
.transaction-row.is-void {
  opacity:.6
}
.badge {
  display:inline-block;
  padding:3px 6px;
  border-radius:6px;
  font-size:10px;
  font-weight:800;
  vertical-align:middle
}
.badge.void {
  background:#fee9e7;
  color:#a32f28
}
.badge.draft {
  background:#fff1d1;
  color:#765700
}
.badge.active {
  background:#e2f5e9;
  color:#187644
}
.badge.paid {
  background:#e2f5e9;
  color:#187644
}
.bottom-nav button.active {
  color:#6858dd;
  background:#f0edff;
  font-weight:800
}
.bottom-nav button:active,.primary:active {transform:scale(.96)}
.recurring-shortcut {
  position:fixed;
  bottom:calc(78px + env(safe-area-inset-bottom));
  right:max(14px,calc((100vw - 540px)/2 + 14px));
  z-index:4;
  border:1px solid #ddd7ff;
  border-radius:18px;
  padding:8px 12px;
  background:#f4f1ff;
  box-shadow:var(--shadow);
  font-size:11px;
  font-weight:750;
  color:#6553d2;
  display:flex;
  align-items:center;
  gap:5px
}
.recurring-shortcut .icon {width:15px;height:15px}
.recurring-shortcut.active {
  background:var(--primary);
  color:#fff
}
.wide {
  display:block;
  width:100%;
  min-height:44px;
  border-radius:13px;
  font-weight:800;
  margin:10px 0 12px
}
.debt-summary {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px
}
.debt-summary .metric {min-width:0}
.debt-summary .metric b {font-size:clamp(18px,5vw,25px);overflow-wrap:anywhere}
.debt-plan-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(110px,45%);
  gap:10px;
  align-items:center;
  margin:8px 0
}
.debt-plan-row label {font-size:12px;font-weight:750}
.debt-plan-row input {text-align:right}
.debt-due small {display:block;margin-top:4px}
.debt-total {
  margin-bottom:0
}
.debt-item {
  border-bottom:1px solid var(--line);
  padding-bottom:12px
}
.debt-item .row-main {align-items:flex-start}
.debt-item .row-copy {overflow-wrap:anywhere}
.debt-title-line {display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
